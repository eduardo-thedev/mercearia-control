services:
  postgres:
    image: postgres:16-alpine
    container_name: mercearia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercearia
      POSTGRES_PASSWORD: mercearia
      POSTGRES_DB: mercearia_db
    ports:
      - "5432:5432"
    volumes:
      - mercearia_pgdata:/var/lib/postgresql/data

volumes:
  mercearia_pgdata:
